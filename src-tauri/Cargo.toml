[package]
name = "letco"
version = "0.1.0"
description = "Letco — seus planejamentos num lugar só"
authors = ["llLeco"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "letco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify = "8"
dirs = "6"
portable-pty = "0.8"
